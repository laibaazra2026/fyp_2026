<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Protected Device Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#841EA0] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative">
        
        
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-[#841EA0]/10 rounded-full mb-4">
                <i class="fa-solid fa-key text-3xl text-[#841EA0]"></i>
            </div>
            <h1 class="text-2xl font-bold text-[#841EA0]">Reset Password</h1>
            <p class="text-sm text-gray-500 mt-1">Enter your email to receive a password reset link</p>
        </div>

        
        <div id="message-box" class="hidden mt-4 p-3 rounded-lg text-xs font-semibold text-center"></div>

        
        <form id="reset-form" class="mt-6 space-y-4" onsubmit="handlePasswordReset(event)">
            
            
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#841EA0]">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required autocomplete="email"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#841EA0] text-sm"
                        placeholder="name@example.com">
                </div>
            </div>

            
            <button type="submit" id="submit-btn" 
                class="w-full bg-[#841EA0] text-white py-3 rounded-xl font-bold text-sm hover:opacity-90 transition duration-200 flex items-center justify-center shadow-lg">
                <span id="btn-text">Send Reset Link</span>
                <span id="spinner" class="hidden ml-2 w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            </button>
        </form>

        
        <div class="text-center mt-6">
            <a href="login.html" class="text-xs font-bold text-[#841EA0] hover:underline flex items-center justify-center">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Login
            </a>
        </div>

    </div>

    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAN01pVGbotIaZWgi59Hs3M9sh9_3lWjHo",
            authDomain: "fyp-mobile-app-and-web-portal.firebaseapp.com",
            projectId: "fyp-mobile-app-and-web-portal",
            storageBucket: "fyp-mobile-app-and-web-portal.firebasestorage.app",
            messagingSenderId: "38986827146",
            appId: "1:38986827146:web:f88efa24e6e9d7ef163473"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showMessage(message, isSuccess = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = message;
            msgBox.className = `mt-4 p-3 rounded-lg text-xs font-semibold text-center ${
                isSuccess ? 'bg-green-50 border border-green-200 text-green-700' : 'bg-red-50 border border-red-200 text-red-700'
            }`;
            msgBox.classList.remove('hidden');
        }

        window.handlePasswordReset = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showMessage('Please enter your email address.');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            btnText.innerText = 'Sending...';
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                await sendPasswordResetEmail(auth, email);
                btnText.innerText = 'Send Reset Link';
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
                showMessage('Password reset email sent! Check your inbox (and spam folder).', true);
            } catch (error) {
                btnText.innerText = 'Send Reset Link';
                spinner.classList.add('hidden');
                submitBtn.disabled = false;

                let msg = error.message;
                if (error.code === 'auth/user-not-found') {
                    msg = 'No account found with this email address.';
                } else {
                    msg = error.message.replace('Firebase: ', '').replace(/\s*\(.*?\)\s*/g, '');
                }
                showMessage(msg);
            }
        };
    </script>
</body>
</html>
