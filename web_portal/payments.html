<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Subscriptions - Device Protection</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-purple-900 text-white flex flex-col justify-between">
            <div class="p-5">
                <h1 class="text-2xl font-bold tracking-wider">Admin Panel</h1>
                <nav class="mt-10 space-y-2">
                    <a href="dashboard.html" class="block py-2.5 px-4 rounded transition hover:bg-purple-800">📊 Dashboard</a>
                    <a href="payments.html" class="block py-2.5 px-4 rounded bg-purple-800 font-semibold">💳 Subscriptions</a>
                </nav>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">Subscription Management</h2>
                <span id="admin-email" class="text-sm text-gray-600">Admin Session Active</span>
            </header>

            <main class="p-6">
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-700">User Subscriptions Table</h3>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User UID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Current Plan</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price Paid</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions (Override Tier)</th>
                                </tr>
                            </thead>
                            <tbody id="subscriptions-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Dynamic rows injected via Firebase JS SDK -->
                                <tr>
                                    <td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading subscriptions...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase App & Firestore SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // TODO: Replace with your actual Firebase web config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadSubscriptions() {
            const tbody = document.getElementById('subscriptions-table-body');
            tbody.innerHTML = '';

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No users found.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((userDoc) => {
                    const data = userDoc.data();
                    const uid = userDoc.id;
                    const plan = data.plan || 'free';
                    const price = data.price || 0;

                    let badgeColor = 'bg-blue-100 text-blue-800';
                    if (plan === 'premium') badgeColor = 'bg-purple-100 text-purple-800';
                    if (plan === 'family') badgeColor = 'bg-indigo-100 text-indigo-800';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-700">${uid}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${badgeColor}">
                                ${plan.toUpperCase()}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">Rs. ${price}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                            <button onclick="updateUserPlan('${uid}', 'free', 0)" class="text-red-600 hover:text-red-900 bg-red-50 px-3 py-1 rounded">Set Free</button>
                            <button onclick="updateUserPlan('${uid}', 'premium', 99)" class="text-purple-600 hover:text-purple-900 bg-purple-50 px-3 py-1 rounded">Set Premium</button>
                            <button onclick="updateUserPlan('${uid}', 'family', 199)" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1 rounded">Set Family</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading subscriptions:", error);
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Error loading data. Check console.</td></tr>`;
            }
        }

        window.updateUserPlan = async function(uid, newPlan, newPrice) {
            try {
                const userRef = doc(db, "users", uid);
                await updateDoc(userRef, {
                    plan: newPlan,
                    price: newPrice
                });
                alert(`Successfully updated user to ${newPlan.toUpperCase()}!`);
                loadSubscriptions();
            } catch (error) {
                console.error("Error updating plan: ", error);
                alert("Failed to update user plan.");
            }
        }

        window.onload = loadSubscriptions;
    </script>
</body>
</html>
