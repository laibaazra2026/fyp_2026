<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Device Protection</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #841EA0, #6A1B8A);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 380px;
            text-align: center;
        }

        .login-container h1 {
            color: #841EA0;
            font-size: 28px;
        }

        .login-container p {
            color: #666;
            margin: 10px 0 25px 0;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .login-container input:focus {
            outline: none;
            border-color: #841EA0;
        }

        .forgot-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .forgot-link {
            color: #841EA0;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            background: #841EA0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #6A1B8A;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🔒 Device Protection</h1>
        <p>Admin Portal Login</p>

        <input type="email" id="email" placeholder="Admin Email" />
        <input type="password" id="password" placeholder="Password" />
        
        <div class="forgot-container">
            <a href="#" id="forgotBtn" class="forgot-link">Forgot Password?</a>
        </div>

        <button id="loginBtn">Login</button>

        <div id="message" class="message"></div>
        <div class="footer">© 2026 Device Protection</div>
    </div>

    <script>
        
        const firebaseConfig = {
          apiKey: "AIzaSyAN01pVGbotIaZWgi59Hs3M9sh9_3lWjHo",
          authDomain: "fyp-mobile-app-and-web-portal.firebaseapp.com",
          projectId: "fyp-mobile-app-and-web-portal",
          storageBucket: "fyp-mobile-app-and-web-portal.firebasestorage.app",
          messagingSenderId: "38986827146",
          appId: "1:38986827146:web:9042f34efac22b99163473"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const msgBox = document.getElementById('message');

        
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            msgBox.textContent = '';
            msgBox.className = 'message';

            if (!email || !password) {
                msgBox.textContent = 'Please fill all fields.';
                msgBox.classList.add('error');
                return;
            }

            try {
                
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                
                if (user.email === 'azralaiba53@gmail.com') {
                    window.location.href = 'dashboard.html';
                } else {
                    msgBox.textContent = 'Access Denied: Not an admin account.';
                    msgBox.classList.add('error');
                    await auth.signOut();
                }
            } catch (err) {
                msgBox.textContent = err.message;
                msgBox.classList.add('error');
            }
        });

        
        document.getElementById('forgotBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            msgBox.textContent = '';
            msgBox.className = 'message';

            if (!email) {
                msgBox.textContent = 'Please enter your admin email above first.';
                msgBox.classList.add('error');
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                msgBox.textContent = 'Password reset link sent! Check your email inbox.';
                msgBox.classList.add('success');
            } catch (err) {
                msgBox.textContent = err.message;
                msgBox.classList.add('error');
            }
        });
    </script>

</body>
</html>
